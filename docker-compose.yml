version: '3.8'

services:
  # MySQL Database
  database:
    image: mysql:8.0
    container_name: waitlist-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: waitlist_db
      MYSQL_USER: waitlist_user
      MYSQL_PASSWORD: waitlist_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - waitlist-network

  # Spring Boot Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waitlist-backend
    environment:
      # Server Configuration
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      
      # Database Configuration
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/waitlist_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: waitlist_user
      SPRING_DATASOURCE_PASSWORD: waitlist_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      
      # JPA/Hibernate Configuration
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      
      # Twilio SMS Configuration (Set your actual credentials)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-your_twilio_account_sid}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-your_twilio_auth_token}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-+1234567890}
      
      # Java Options
      JAVA_OPTS: -Xms256m -Xmx512m
    
    ports:
      - "8080:8080"
    
    depends_on:
      database:
        condition: service_healthy
    
    networks:
      - waitlist-network
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/restaurants"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # phpMyAdmin for Database Management (Optional)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: waitlist-phpmyadmin
    environment:
      PMA_HOST: database
      PMA_USER: waitlist_user
      PMA_PASSWORD: waitlist_password
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - database
    networks:
      - waitlist-network

volumes:
  mysql_data:
    driver: local

networks:
  waitlist-network:
    driver: bridge

