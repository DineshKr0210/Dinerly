spring.application.name=backend
server.port=8080

# PostgreSQL / Datasource Configuration - read from environment for secrets
# Use SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD env vars
# Example: SPRING_DATASOURCE_URL=jdbc:postgresql://host:5432/dbname
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.lpoaptxjywmkrpozxsaa.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=CXvOSn4wGDVsa7hrkfl9hFbdClxfzBOzKo0ZC62JWpWJhhjuvl501ui923WUMB9GKvuJgZzWmFNCypefHir11w==
jwt.expiration=86400000

# Email Configuration (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Twilio Configuration for SMS - read from environment variables
# Required env vars: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE_NUMBER
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# Logging
logging.level.root=INFO
logging.level.com.restaurant.waitlist.backend=DEBUG

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
