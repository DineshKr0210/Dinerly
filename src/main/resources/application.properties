# =========================
# SWAGGER / OPENAPI
# =========================
springdoc.api-docs.path=/v3/api-docs
# springdoc.swagger-ui.path is left at Springdoc's default /swagger-ui

# Groups are declared in OpenApiConfig (Waitlist & Guest -> Restaurant -> Admin -> All);
# this makes Waitlist & Guest the one shown when the page first loads.
springdoc.swagger-ui.urls-primary-name=1-waitlist-guest

# Testing ergonomics: "Try it out" is on by default, the entered JWT survives a page
# refresh, a search box filters the (large) endpoint list, and each response shows
# how long the call took.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true

# Collapse every group to just its tag headers on load instead of dumping all ~35
# tags fully expanded — with this many endpoints, "expand only what you need" reads
# far cleaner than one long scroll.
springdoc.swagger-ui.doc-expansion=none

# Sort operations within a tag alphabetically by path so related endpoints
# (list/get/create/update/delete) land next to each other.
springdoc.swagger-ui.operations-sorter=alpha


